 if(page==="progress")body=<><div className="head"><h1>Results</h1></div><div className="hero"><span className="lab">Overall progress</span><div className="big">{overall}<sup>%</sup></div><Bar v={overall}/><span className="tag">Goals completed {s.goals.filter(g=>g.completed).length} · Tasks completed {done.length} of {s.tasks.length} · Milestones {ms.filter(m=>m.completed).length}/{ms.length} · Current streak {st.cur} · Best streak {st.best} · Focused {Math.floor(focusMin/60)}h {focusMin%60}m</span></div>
 <div className="sec"><div className="lab">Recent results</div><Results/></div>
 <div className="sec bars"><div className="lab">By category</div>{catBars.map(([c,v,n])=><div className="br" key={c}><span>{c}</span><Bar v={v}/><span>{n?v+"%":"–"}</span></div>)}</div>
 <div className="sec"><div className="lab">This week</div><div style={{maxWidth:420}}><Week tasks={s.tasks} mon={s.settings.weekStartsOn}/></div></div>
 <div className="sec"><div className="lab">Your journey</div><Journey n={12}/></div></>;
 if(page==="achievements")body=<><div className="head"><h1>Achievements</h1><span className="lab">{ACH.filter(a=>a[2]).length} of {ACH.length} unlocked</span></div><div className="ach">{ACH.map(([t,d,u,ic])=><div key={t} className={u?"":"lk"}><I n={ic} style={{color:u?"var(--brass)":"var(--mu)",width:24,height:24}}/><h2 style={{marginTop:8}}>{t}</h2><span className="tag">{d} · {u?"Unlocked":"Locked"}</span></div>)}</div></>;
 if(page==="more")body=<><div className="head"><h1>More</h1></div>{[["calendar","Calendar"],["achievements","Achievements"],["settings","Settings"]].map(([k,l])=><button key={k} className="row nav" style={{padding:"16px 0"}} onClick={()=>setPage(k)}>{l}</button>)}</>;
 if(page==="settings")body=<><div className="head"><h1>Settings</h1></div>
 <div className="sec"><div className="lab">Account</div><div className="sw">{user.email}<SignOutBtn/></div></div>
 <div className="sec"><div className="lab">Appearance</div><div className="tabs">{["light","dark","system"].map(t=><button key={t} className={s.settings.theme===t?"on":""} onClick={()=>setSet("theme",t)}>{t[0].toUpperCase()+t.slice(1)}</button>)}</div></div>
 <div className="sec"><div className="lab">My why</div><textarea rows="3" aria-label="My why" value={s.settings.myWhy} onChange={e=>setSet("myWhy",e.target.value)}/></div>
 <div className="sec"><div className="lab">Preferences</div>{[["showQuotes","Show motivational quotes"],["animations","Enable animations"]].map(([k,l])=><div className="sw" key={k}>{l}<input type="checkbox" style={{width:"auto"}} aria-label={l} checked={s.settings[k]} onChange={e=>setSet(k,e.target.checked)}/></div>)}<div className="sw">Start week on Monday<input type="checkbox" style={{width:"auto"}} aria-label="Start week on Monday" checked={s.settings.weekStartsOn===1} onChange={e=>setSet("weekStartsOn",e.target.checked?1:0)}/></div></div>
 <div className="sec"><div className="lab">Data</div><div className="fil">{!s.goals.length&&!s.tasks.length&&<button className="btn ghost" onClick={()=>up(p=>{const x=seed();return{...p,goals:x.goals,tasks:x.tasks,activity:x.activity,focus:x.focus,sample:true}})}>Load sample data</button>}<button className="btn ghost" onClick={()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:"application/json"}));a.download="waypoint-data.json";a.click()}}>Export data</button>
 {s.sample&&<button className="btn ghost" onClick={()=>setConfirm({m:"Clear all sample goals, tasks and history?",go:()=>up(p=>({...p,goals:[],tasks:[],activity:[],focus:[],sample:false}))})}>Clear sample data</button>}
 <button className="btn danger" onClick={()=>setConfirm({m:"Delete all data? This cannot be undone.",go:()=>up(p=>({...p,goals:[],tasks:[],activity:[],focus:[],saved:[],sample:false}))})}>Delete all data</button></div>{s.sample&&<p className="tag">You are viewing sample data. Clear it to start fresh.</p>}</div></>;
 return<div className="app"><aside><div className="logo"><Logo/>WAYPOINT</div>
 {[["Today",NAV.slice(0,1)],["Organize",NAV.slice(1,4)],["Insights",NAV.slice(4)]].map(([g,items])=><div key={g}><div className="grp">{g==="Today"?"Today":g}</div>{items.map(([k,l,ic])=><button key={k} className={"nav"+(page===k?" on":"")} onClick={()=>setPage(k)} aria-current={page===k?"page":undefined}><I n={ic}/>{l==="Today"?"Overview":l}</button>)}</div>)}
 <div style={{marginTop:"auto"}}><div className="nav" style={{color:"var(--brass)"}}><I n="flame"/>{st.cur} day streak</div><button className={"nav"+(page==="settings"?" on":"")} onClick={()=>setPage("settings")}><I n="gear"/>Settings</button><div className="tag" style={{padding:"6px 10px"}}>Press N for task, G for goal</div></div></aside>
 <main>{s.sample&&page==="today"&&<p className="tag" style={{marginTop:-20}}>Sample data. <button style={{textDecoration:"underline"}} onClick={()=>setPage("settings")}>Clear it in Settings</button></p>}<div key={page} style={{animation:"u .3s"}}>{body}</div></main>
 <nav className="tb" aria-label="Primary">{[["today","Today","home"],["tasks","Tasks","list"],["goals","Goals","target"],["progress","Progress","chart"],["more","More","more"]].map(([k,l,ic])=><button key={k} className={page===k?"on":""} onClick={()=>setPage(k)}><I n={ic}/>{l}</button>)}</nav>
 {modal?.k==="task"&&<TaskForm t={modal.t} goals={s.goals} onSave={saveTask} onClose={()=>setModal(null)}/>}
 {modal?.k==="goal"&&<GoalForm g={modal.g} onSave={saveGoal} onClose={()=>setModal(null)}/>}
 {confirm&&<Modal title="Are you sure?" onClose={()=>setConfirm(null)}><p>{confirm.m}</p><div className="acts"><button className="btn ghost" onClick={()=>setConfirm(null)}>Cancel</button><button className="btn danger" onClick={()=>{confirm.go();setConfirm(null)}}>Confirm</button></div></Modal>}
 {toast&&<div className="toast" role="status">{toast}</div>}</div>}
function Auth(){const[m,setM]=useState("in"),[e,setE]=useState(""),[p,setP]=useState(""),[msg,setMsg]=useState(""),[b,setB]=useState(false),[show,setShow]=useState(false),[ok,setOk]=useState(false);
 const go=async ev=>{ev.preventDefault();setB(true);setMsg("");setOk(false);let r;
  try{if(m==="in")r=await sb.auth.signInWithPassword({email:e,password:p});
   else{r=await sb2.auth.signUp({email:e,password:p});if(!r.error){setM("in");setP("");setShow(false);setOk(true);setMsg("Account created. Please sign in.");setB(false);return}}}
  catch(x){r={error:{message:x.message}}}
  if(r.error)setMsg(r.error.message);setB(false)};
 return<div className="auth"><main style={{maxWidth:480,margin:"0 auto",width:"100%"}}><div className="logo"><Logo/>WAYPOINT</div><h1>{m==="in"?"Welcome back.":"Start your journey."}</h1><p className="tag">Your goals. Your progress. Your journey.</p>
 <form onSubmit={go}><div className="modal" style={{border:0,padding:"8px 0",background:"none",animation:"none"}}><F l="Email"><input type="email" required autoComplete="email" value={e} onChange={x=>setE(x.target.value)}/></F><div style={{position:"relative"}}><F l="Password"><input type={show?"text":"password"} required minLength="6" style={{paddingRight:64}} autoComplete={m==="in"?"current-password":"new-password"} value={p} onChange={x=>setP(x.target.value)}/></F><button type="button" className="ibtn" aria-pressed={show} aria-label={show?"Hide password":"Show password"} style={{position:"absolute",right:10,bottom:8}} onClick={()=>setShow(!show)}><I n={show?"eyeoff":"eye"}/></button></div></div>
 {msg&&<p className={ok?"":"od"} style={ok?{color:"var(--green)"}:null} role="alert">{msg}</p>}<div className="fil"><button className="btn" disabled={b} aria-busy={b}>{b&&<span className="spin" aria-hidden="true"/>}{b?(m==="in"?"Signing in…":"Creating account…"):(m==="in"?"Sign in":"Create account")}</button><button type="button" className="btn ghost" disabled={b} onClick={()=>{setM(m==="in"?"up":"in");setMsg("")}}>{m==="in"?"New here? Sign up":"Have an account? Sign in"}</button></div></form></main></div>}
function SignOutBtn(){const[b,setB]=useState(false);
 const go=async()=>{if(b)return;setB(true);try{await Promise.all([sb.auth.signOut(),new Promise(r=>setTimeout(r,1200))])}catch(e){}setB(false)};
 return<button className="btn ghost" disabled={b} aria-busy={b} onClick={go}>{b&&<span className="spin" aria-hidden="true"/>}{b?"Signing out…":"Sign out"}</button>}
function Splash({d:D}){const M=["Loading your goals…","Syncing your tasks…","Almost there…"],[i,setI]=useState(0),[d]=useState(D||2);
 useEffect(()=>{const t=setInterval(()=>setI(x=>Math.min(x+1,M.length-1)),d*1000/M.length);return()=>clearInterval(t)},[]);
 return<div className="splash" style={{"--d":d+"s"}} role="status" aria-live="polite"><div className="sp-in"><svg viewBox="0 0 24 24" width="68" height="68" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" aria-hidden="true"><circle className="sp-c" cx="12" cy="12" r="10"/><path className="sp-l" d="M6.5 16.5l4-5.5 2.5 3 4.5-6.5"/><circle className="sp-d" cx="17.5" cy="7.5" r="1.7" fill="var(--brass)" stroke="none"/></svg><div className="logo sp-w">WAYPOINT</div><div className="sp-bar"><i/></div><p className="tag" style={{margin:0}}>{M[i]}</p></div></div>}
function Root(){const[user,setUser]=useState(undefined),[data,setData]=useState(null),[err,setErr]=useState("");const[ready,setReady]=useState(false),[boot,setBoot]=useState(false);
 useEffect(()=>{const t=setTimeout(()=>setBoot(true),3500);return()=>clearTimeout(t)},[]);
 useEffect(()=>{setReady(false);if(!user)return;const t=setTimeout(()=>setReady(true),2000);return()=>clearTimeout(t)},[user?.id]);
 useEffect(()=>{if(!sb)return;sb.auth.getSession().then(({data})=>setUser(data.session?.user||null));const{data:l}=sb.auth.onAuthStateChange((_,s)=>setUser(s?.user||null));return()=>l.subscription.unsubscribe()},[]);
 useEffect(()=>{setData(null);setErr("");if(user)loadAll(user).then(setData).catch(e=>setErr(e.message))},[user?.id]);
 if(!sb)return<main style={{padding:40}}><h1>Connect Supabase</h1><p className="tag">Open this file and set CFG.url and CFG.key near the top of the script.</p></main>;
 if(user===undefined||!boot)return<Splash d={boot?2:3.5}/>;
 if(!user)return<Auth/>;
 if(err)return<main><h1>Could not load your data</h1><p className="od">{err}</p><p className="tag">Have you run schema.sql in the Supabase SQL editor?</p><SignOutBtn/></main>;
 return data&&ready?<App key={user.id} init={data} user={user}/>:<Splash d={boot?2:3.5}/>}
ReactDOM.createRoot(document.getElementById("root")).render(<Root/>);
</script></body></html>
